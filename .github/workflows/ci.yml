name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check web types
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path api/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings

      - name: Run unit and API tests
        run: npm test

      - name: Build web and API
        run: npm run build

      - name: Confirm web artifact
        run: test -f dist/index.html
