<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Intake Desk sample receipt</title>
  <desc id="desc">A dock-style receipt sheet compares expected and received supplier quantities.</desc>
  <rect width="1200" height="630" fill="#F4E9CF"/>
  <path d="M72 0v630M0 86h1200" stroke="#A69B82" stroke-width="2"/>
  <rect x="72" y="86" width="484" height="70" fill="#B83A1B"/>
  <path d="M556 86h38l-38 70z" fill="#F4E9CF"/>
  <g fill="#182327" font-family="Arial Narrow, sans-serif" font-weight="700">
    <text x="72" y="235" font-size="86">CHECK THE DELIVERY.</text>
    <text x="72" y="296" font-size="32">INTAKE DESK / WEST YARD</text>
  </g>
  <g transform="translate(650 150)">
