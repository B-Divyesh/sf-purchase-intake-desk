      <text x="28" y="250" font-size="21">SEAL-28</text><text x="306" y="250" font-size="21" font-weight="700">24 / 24</text>
      <text x="28" y="324" font-size="25" font-weight="700" fill="#B83A1B">2 SHORT · 1 DAMAGED</text>
